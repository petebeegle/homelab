name: CI runner proof (throwaway, do not merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-dev-prod
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: No production credentials in the pod
        run: |
          set -u
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token && echo "no service account token mounted"
      - name: Development cluster kubeconfig
        uses: ./.github/actions/dev-kubeconfig
      - name: Development access is the narrow dev-runner account
        run: |
          set -euo pipefail
          kubectl -n flux-system get kustomizations --no-headers | wc -l | xargs echo "development kustomizations visible:"
          echo "create kustomizations: $(kubectl auth can-i create kustomizations.kustomize.toolkit.fluxcd.io -n flux-system)"
          echo "get secrets:           $(kubectl auth can-i get secrets -n flux-system || true)"
      - name: Production and the internet are unreachable
        run: |
          set -u
          fail=0
          for u in https://192.168.30.150:6443/version https://kubernetes.default.svc/version https://192.168.30.99:5001/ https://www.google.com/ https://1.1.1.1/; do
            if code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 "$u"); then
              echo "REACHABLE (bad): $u -> $code"; fail=1
            else
              echo "blocked: $u"
            fi
          done
          # Production's gateways are Cilium's Envoy, which enforces this pod's policy itself and
          # answers 403 "Access denied" instead of dropping the connection. Any app response fails.
          for u in https://homepage.lab.petebeegle.com/ https://whoami.lab.petebeegle.com/ https://grafana.lab.petebeegle.com/; do
            body=$(curl -sk --max-time 8 -w ' HTTP%{http_code}' "$u" || echo "dropped")
            case "$body" in
              "Access denied HTTP403"|dropped) echo "blocked: $u ($body)" ;;
              *) echo "REACHABLE (bad): $u -> ${body: -40}"; fail=1 ;;
            esac
          done
          exit "$fail"
      - name: Development route through its gateway
        run: curl -fsS -o /dev/null -w 'whoami.dev -> %{http_code}\n' --max-time 15 https://whoami.dev.lab.petebeegle.com/
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm install --no-audit --no-fund
      - name: Full smoke test of whoami from production, with the browser check
        run: python3 tools/development/verify_branch_deploy.py --ci --app whoami --branch "${{ github.head_ref }}" --slug pr-9527 --kubeconfig "${KUBECONFIG}" --browser
      - name: Remove the environment
        if: always()
        run: python3 tools/development/cleanup_pr_envs.py --kubeconfig "${KUBECONFIG}" --slug pr-9527
      - name: Upload an artifact (Actions storage reachable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: tests/browser/test-results
          if-no-files-found: ignore
