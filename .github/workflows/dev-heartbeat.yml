name: dev-heartbeat

# The development cluster has no monitoring stack, so this is its alert: it runs on a
# GitHub-hosted runner (so it still runs when the dev runner is dead) and fails, which
# makes GitHub email the repo owner, when no job on the in-cluster homelab-dev runner
# (dev-cleanup, or dev-smoke's smoke job) has succeeded in 12 hours. Why 12 hours:
# docs/decisions.md ("Changes go through pull requests").
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check that a job on the dev runner succeeded recently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in dev-cleanup.yml dev-smoke.yml; do
            gh api "repos/${REPO}/actions/workflows/${workflow}/runs?per_page=20" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id'
          done | while read -r run; do
            gh api "repos/${REPO}/actions/runs/${run}/jobs" --jq '.jobs[]'
          done | python3 tools/development/dev_heartbeat.py --runner-label homelab-dev --max-age-seconds 43200
