name: dev-cleanup

# Removes PR smoke environments that outlived their run (a cancelled or crashed job).
# GitHub fires this cron far less often than asked, so dev-smoke sweeps too. It also
# doubles as a liveness probe: it can only succeed when the dev runner pod can start
# and reach the dev cluster, and dev-heartbeat alerts when nothing on that runner
# (this or a dev-smoke run) has succeeded recently.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: homelab-dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Development cluster kubeconfig
        uses: ./.github/actions/dev-kubeconfig
      - name: Remove stale PR environments
        run: python3 tools/development/cleanup_pr_envs.py --kubeconfig "${KUBECONFIG}" --older-than 3h
      - name: Restore development if a base smoke test was killed mid-run
        run: python3 tools/development/base_smoke.py --kubeconfig "${KUBECONFIG}" --recover-stale
