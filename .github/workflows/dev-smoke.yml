name: dev-smoke

# Smoke-tests a PR's app change in the development cluster before merge.
# pull_request_target runs THIS file as it exists on main, never the PR's copy,
# and the jobs check out main only; the PR's code reaches the cluster through
# Flux (the branch environment), not through this workflow's checkout.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # contents: write only to build and delete the temporary base-smoke/pr-<N> merge branch.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tested: ${{ steps.classify.outputs.tested }}
      app: ${{ steps.classify.outputs.app }}
      browser: ${{ steps.classify.outputs.browser }}
      reason: ${{ steps.classify.outputs.reason }}
      automerge: ${{ steps.classify.outputs.automerge }}
      base: ${{ steps.affected.outputs.base }}
      affected: ${{ steps.affected.outputs.affected }}
      base_reason: ${{ steps.affected.outputs.reason }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Classify the PR's changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            | python3 tools/development/classify_pr.py > classification.json
          cat classification.json
          {
            echo "tested=$(jq -r '.tested' classification.json)"
            echo "app=$(jq -r '.app // ""' classification.json)"
            echo "browser=$(jq -r '.browser' classification.json)"
            echo "reason=$(jq -r '.reason | gsub("[\\r\\n]"; " ")' classification.json)"
            echo "automerge=$(jq -r '.automerge' classification.json)"
          } >> "$GITHUB_OUTPUT"
      # Not an app-only PR: does it change anything the development cluster runs? Judge the PR
      # as it would land, merged onto current main (a stale head would show main's newer changes
      # as the PR's). The base job builds its own merge again when it gets the runner.
      - name: Merge the PR onto current main
        id: merge
        if: steps.classify.outputs.tested != 'true'
        uses: ./.github/actions/pr-merge
        with:
          branch: base-smoke/pr-${{ github.event.pull_request.number }}
          token: ${{ github.token }}
      - name: Check out the PR merged onto main, as data
        if: steps.classify.outputs.tested != 'true' && steps.merge.outputs.mergeable == 'true'
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ steps.merge.outputs.sha }}
          path: pr
          # Depth 2 so the merge's first parent (main) is present to compare against.
          fetch-depth: 2
          persist-credentials: false
      - name: Find the development Kustomizations the PR changes
        id: affected
        if: steps.classify.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGEABLE: ${{ steps.merge.outputs.mergeable }}
          MERGE_REASON: ${{ steps.merge.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$MERGEABLE" != true ]; then
            { echo "base=false"; echo "reason=${MERGE_REASON}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git -C pr rev-parse HEAD^1)" != "$(git rev-parse HEAD)" ]; then
            { echo "base=false"; echo "reason=the merge is not a merge onto current main (main moved while classify ran); re-run it"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
            | python3 tools/development/affected_dev.py --base . --head pr > affected.json
          cat affected.json
          affected=$(jq -r '.affected | join(",")' affected.json)
          blocked=$(jq -r '.blocked // ""' affected.json | tr -d '\r\n')
          {
            echo "affected=${affected}"
            if [ -n "$blocked" ]; then
              echo "base=false"; echo "reason=${blocked}"
            elif [ -n "$affected" ]; then
              echo "base=true"; echo "reason=changes development Kustomizations: ${affected}"
            else
              echo "base=false"; echo "reason=changes nothing the development cluster runs (production-only paths are covered by Flux render)"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Delete the temporary branch
        if: always() && steps.classify.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          curl -sS -o /dev/null -w 'delete base-smoke/pr-%{http_code}\n' -X DELETE
          -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"
          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/base-smoke/pr-${PR_NUMBER}" || true

  smoke:
    name: smoke
    needs: classify
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.classify.outputs.tested == 'true'
    runs-on: homelab-dev
    timeout-minutes: 20
    # contents: write only to build and delete the temporary pr-smoke/pr-<N> merge branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Development cluster kubeconfig
        uses: ./.github/actions/dev-kubeconfig
      # The probes come from main, so deploy what merging would land now, not the PR head: a head
      # behind main would be judged by main's probes against the old app (#433). Built here, when
      # the job has the runner, so a main that moved while it queued is included.
      - name: Merge the PR onto current main
        id: merge
        uses: ./.github/actions/pr-merge
        with:
          branch: pr-smoke/pr-${{ github.event.pull_request.number }}
          token: ${{ github.token }}
      - name: Stop on a conflict
        if: steps.merge.outputs.mergeable != 'true'
        env:
          REASON: ${{ steps.merge.outputs.reason }}
        run: |
          echo "::error::${REASON}"
          exit 1
      - name: Install browser test dependencies
        if: needs.classify.outputs.browser == 'true'
        working-directory: tests/browser
        run: npm install --no-audit --no-fund
      - name: Remove leftovers for this PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/development/cleanup_pr_envs.py --kubeconfig "${KUBECONFIG}" --slug "pr-${PR_NUMBER}"
      - name: Smoke-test the PR in the development cluster
        env:
          APP: ${{ needs.classify.outputs.app }}
          BROWSER: ${{ needs.classify.outputs.browser }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          args=(--ci --app "$APP" --branch "pr-smoke/pr-${PR_NUMBER}" --slug "pr-${PR_NUMBER}" --kubeconfig "${KUBECONFIG}")
          if [ "$BROWSER" = true ]; then
            args+=(--browser)
          fi
          python3 tools/development/verify_branch_deploy.py "${args[@]}"
      - name: Remove this PR's environment
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/development/cleanup_pr_envs.py --kubeconfig "${KUBECONFIG}" --slug "pr-${PR_NUMBER}"
      - name: Delete the temporary branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          curl -sS -o /dev/null -w 'delete pr-smoke/pr-%{http_code}\n' -X DELETE
          -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"
          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/pr-smoke/pr-${PR_NUMBER}" || true
      # dev-cleanup's cron fires only every few hours, so each smoke run also sweeps
      # environments other runs left behind. The 3h age limit (the same as dev-cleanup)
      # spares any concurrently running PR, whose job times out after 20 minutes. A
      # failed sweep is only a warning: it must not change this PR's smoke result.
      - name: Remove other PRs' stale environments
        if: ${{ !cancelled() }}
        run: |
          if ! python3 tools/development/cleanup_pr_envs.py --kubeconfig "${KUBECONFIG}" --older-than 3h; then
            echo "::warning::could not remove stale pr-* environments; dev-cleanup will retry"
          fi
          if ! python3 tools/development/base_smoke.py --kubeconfig "${KUBECONFIG}" --recover-stale; then
            echo "::warning::could not restore development after a stale base smoke test; dev-cleanup will retry"
          fi
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: smoke-results
          path: tests/browser/test-results
          if-no-files-found: ignore

  # The PR changes the development cluster's own platform (Cilium, cert-manager, CSI, CRDs,
  # Gateway, ...): apply it to development, wait for everything to settle, run the whoami and
  # homepage smoke tests on top, and always restore main. tools/development/base_smoke.py.
  base:
    name: base
    needs: classify
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.classify.outputs.base == 'true'
    runs-on: homelab-dev
    timeout-minutes: 60
    # contents: write only to build and delete the temporary base-smoke/pr-<N> merge branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Development cluster kubeconfig
        id: kubeconfig
        uses: ./.github/actions/dev-kubeconfig
      # Built again here, not reused from classify, so a main that moved while the job queued
      # is included.
      - name: Merge the PR onto current main
        id: merge
        uses: ./.github/actions/pr-merge
        with:
          branch: base-smoke/pr-${{ github.event.pull_request.number }}
          token: ${{ github.token }}
      - name: Stop on a conflict
        if: steps.merge.outputs.mergeable != 'true'
        env:
          REASON: ${{ steps.merge.outputs.reason }}
        run: |
          echo "::error::${REASON}"
          exit 1
      - name: Check out the PR merged onto main, as data
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ steps.merge.outputs.sha }}
          path: pr
          # Depth 2 so the merge's first parent (main) is present to compare against.
          fetch-depth: 2
          persist-credentials: false
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm install --no-audit --no-fund
      - name: Apply the PR to development's platform, check it, restore main
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AFFECTED: ${{ needs.classify.outputs.affected }}
        run: |
          set -euo pipefail
          echo "Development Kustomizations this PR changes: ${AFFECTED}" | tee -a "$GITHUB_STEP_SUMMARY"
          # exec: bash would not pass a cancellation signal on to a child process.
          exec python3 tools/development/base_smoke.py --kubeconfig "${KUBECONFIG}" --pr "${PR_NUMBER}" \
            --sha "${MERGE_SHA}" --head-dir pr
      # A cancelled or killed job never reaches base_smoke's own restore; this does.
      # Not when the job stopped before the kubeconfig: then nothing touched development.
      - name: Make sure development is restored
        if: always() && steps.kubeconfig.outcome == 'success'
        run: python3 tools/development/base_smoke.py --kubeconfig "${KUBECONFIG}" --recover-stale --max-age-seconds 0
      - name: Delete the temporary branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          curl -sS -o /dev/null -w 'delete base-smoke/pr-%{http_code}\n' -X DELETE
          -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"
          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/base-smoke/pr-${PR_NUMBER}" || true
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: base-smoke-results
          path: tests/browser/test-results
          if-no-files-found: ignore

  dev-smoke:
    name: dev-smoke
    needs: [classify, smoke, base]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report the result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BASE_RESULT: ${{ needs.base.result }}
          TESTED: ${{ needs.classify.outputs.tested }}
          BASE: ${{ needs.classify.outputs.base }}
          REASON: ${{ needs.classify.outputs.reason }}
          BASE_REASON: ${{ needs.classify.outputs.base_reason }}
          AUTOMERGE: ${{ needs.classify.outputs.automerge }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY_RESULT" != success ]; then
            echo "classification ${CLASSIFY_RESULT}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$BASE" = true ]; then
            if [ "$BASE_RESULT" != success ]; then
              echo "base smoke ${BASE_RESULT}: ${BASE_REASON}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "base smoke passed: ${BASE_REASON}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$TESTED" != true ]; then
            # Renovate merges itself once every check is green. Its auto-merge paths are all
            # deployed by development, so an untested PR inside them must not go green.
            if [ "$AUTOMERGE" = true ] && [[ "$HEAD_REF" == renovate/* ]]; then
              echo "not smoke-tested, so Renovate must not auto-merge it: ${REASON}; ${BASE_REASON}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "not smoke-tested: ${REASON}; ${BASE_REASON}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SMOKE_RESULT" != success ]; then
            echo "smoke ${SMOKE_RESULT}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "smoke passed" | tee -a "$GITHUB_STEP_SUMMARY"
