---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: tools/.python-version

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: "0.23.0"
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors -sSLo terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo install -m 0755 terraform-docs /usr/local/bin/terraform-docs

      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Terraform root modules
        run: |
          set -euo pipefail

          terraform_init_with_retry() {
            local dir="$1"
            local attempt

            for attempt in 1 2 3; do
              if terraform -chdir="${dir}" init -backend=false -input=false -no-color; then
                return 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "::error::terraform init failed for ${dir} after ${attempt} attempts"
                return 1
              fi

              echo "terraform init failed for ${dir}; retrying in 10 seconds (attempt $((attempt + 1))/3)"
              sleep 10
            done
          }

          for dir in \
            terraform/production \
            terraform/development \
            terraform/external/grafana \
            terraform/external/nexus \
            terraform/external/synology
          do
            echo "::group::${dir}"
            terraform_init_with_retry "${dir}"
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Add Jellyfin Helm repository
        run: helm repo add jellyfin https://jellyfin.github.io/jellyfin-helm

      - name: Set up Flux CLI
        uses: ./.github/actions/setup-flux

      - name: Validate direct-auth 1Password chart render
        run: tools/policy/check_onepassword_operator_chart.sh

      - name: Validate 1Password production foundation policy
        run: python3 tools/policy/check_onepassword_production_foundation.py

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.7.0"
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          url="https://github.com/yannh/kubeconform/releases/download"
          curl -sSLo kubeconform.tar.gz \
            "${url}/v${KUBECONFORM_VERSION}/${archive}"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render production manifests
        run: >-
          kubectl kustomize kubernetes/clusters/production >
          /tmp/homelab-production.yaml

      - name: Render development manifests
        run: >-
          kubectl kustomize kubernetes/clusters/development >
          /tmp/homelab-development.yaml

      - name: Test Jellyfin config migration
        run: >-
          python3 -m unittest
          tools.development.tests.test_jellyfin_manifests

      - name: Validate rendered manifests
        run: >-
          kubeconform -summary -ignore-missing-schemas
          /tmp/homelab-production.yaml
          /tmp/homelab-development.yaml

  flux-render:
    name: Flux render
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # flux-local 7.11 crashes on Python 3.14 (argparse BooleanOptionalAction no longer
      # takes `type`), so this job stays on 3.12 until flux-local supports 3.14.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Flux CLI
        uses: ./.github/actions/setup-flux

      - name: Install kustomize
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
          KUSTOMIZE_VERSION: "5.7.1"
        run: |
          set -euo pipefail
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          release="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors -sSLO "${release}/${archive}"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors -sSLO "${release}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Install flux-local
        run: python -m pip install --requirement tools/ci/flux-local/requirements.txt

      # Builds every Flux Kustomization production runs (with cluster-vars substitution) and
      # templates every HelmRelease with its pinned chart. It proves the manifests and charts
      # render; it does not prove anything runs. Retried once, because remote kustomize bases
      # and chart repositories are fetched over the network.
      - name: Render every production Kustomization and HelmRelease
        run: |
          for attempt in 1 2; do
            if flux-local test --enable-helm --all-namespaces --path kubernetes/clusters/production; then
              exit 0
            fi
            echo "::warning::flux-local failed (attempt ${attempt}/2)"
          done
          exit 1

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check encrypted secret manifests
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find kubernetes \
              \( -path '*/secret.yaml' -o -name 'grafana-env.yaml' \) \
              -type f |
              sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No secret manifests found."
            exit 0
          fi

          failed=0
          for file in "${files[@]}"; do
            if ! grep -Eq '^sops:' "${file}"; then
              echo "::error file=${file}::Missing top-level sops block"
              failed=1
            fi
            if ! grep -q 'ENC\[' "${file}"; then
              echo "::error file=${file}::Missing encrypted ENC[...] values"
              failed=1
            fi
          done
          exit "${failed}"

  agnix:
    name: Agnix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"

      - name: Install Agnix
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --global agnix@0.25.0; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Validate agent instructions
        run: agnix .
