---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onepassword-operator
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 2m
  path: ./kubernetes/infra/controllers/onepassword-operator
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: crds
  postBuild:
    substitute:
      # Operator 1.12.0 cannot disable its ticker with zero. One year makes
      # development refresh explicitly event-driven without overflowing it.
      ONEPASSWORD_POLLING_INTERVAL: "31536000"
