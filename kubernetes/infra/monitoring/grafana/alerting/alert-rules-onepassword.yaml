---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: onepassword
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: "kubernetes"
  interval: 1m
  rules:
    - uid: onepassword-operator-unavailable
      title: 1Password Operator Unavailable
      condition: C
      for: 10m
      noDataState: Alerting
      execErrState: Error
      annotations:
        description: "The 1Password Operator Deployment is missing or has unavailable replicas for at least 10 minutes. Existing generated Secrets remain, but refresh and rotation are blocked."
        summary: 1Password credential synchronization is unavailable
        runbook: "Start with: flux get kustomization onepassword-operator; kubectl -n onepassword-system get helmrelease,deployment,pods; kubectl -n onepassword-system logs deployment/onepassword-connect-operator"
      labels:
        severity: critical
        component: onepassword
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: max(kube_deployment_spec_replicas{exported_namespace="onepassword-system",deployment="onepassword-connect-operator"} - kube_deployment_status_replicas_available{exported_namespace="onepassword-system",deployment="onepassword-connect-operator"}) OR absent(kube_deployment_spec_replicas{exported_namespace="onepassword-system",deployment="onepassword-connect-operator"})
            refId: A
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            expression: A
            reducer: last
            type: reduce
            refId: B
        - refId: C
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            expression: B
            conditions:
              - evaluator:
                  params: [0]
                  type: gt
                operator:
                  type: and
                query:
                  params: [C]
                type: query
            type: threshold
            refId: C

    - uid: onepassword-item-unready
      title: 1Password Item Unready
      condition: C
      for: 10m
      noDataState: NoData
      execErrState: Error
      annotations:
        description: "{{ $values.B.Value }} OnePasswordItem resource(s) have not reported Ready=True for at least 10 minutes."
        summary: 1Password item synchronization is failing
        runbook: "Start with: kubectl get onepassworditems.onepassword.com -A; kubectl describe onepassworditem <name> -n <namespace>; kubectl -n onepassword-system logs deployment/onepassword-connect-operator"
      labels:
        severity: critical
        component: onepassword
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: count(onepassword_item_info{ready!="True"}) OR vector(0)
            refId: A
        - refId: B
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            expression: A
            reducer: last
            type: reduce
            refId: B
        - refId: C
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: __expr__
          model:
            expression: B
            conditions:
              - evaluator:
                  params: [0]
                  type: gt
                operator:
                  type: and
                query:
                  params: [C]
                type: query
            type: threshold
            refId: C
