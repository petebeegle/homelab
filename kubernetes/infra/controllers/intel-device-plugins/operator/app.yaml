---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: intel
  namespace: flux-system
spec:
  interval: 12h
  url: https://intel.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-device-plugins-system
spec:
  interval: 5m0s
  releaseName: intel-device-plugins-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    # The chart's webhook configurations carry cert-manager's CA bundle, so
    # cainjector co-owns every webhook entry. Under server-side apply, entries
    # a new chart drops (0.37 removed DLB/FPGA) keep cainjector's fields and
    # fail validation. A client-side merge deletes them by name.
    serverSideApply: disabled
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: intel-device-plugins-operator
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
      version: "0.37.2"
  values:
    manager:
      devices:
        gpu: true
