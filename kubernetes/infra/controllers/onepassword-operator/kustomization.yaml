---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onepassword-system
resources:
  - namespace.yaml
  - app.yaml
configMapGenerator:
  - name: onepassword-operator-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
