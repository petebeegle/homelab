---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: onepassword
  namespace: onepassword-system
spec:
  interval: 12h
  url: https://1password.github.io/connect-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-operator
  namespace: onepassword-system
spec:
  interval: 5m
  releaseName: onepassword-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: connect
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: onepassword-system
  valuesFrom:
    - kind: ConfigMap
      name: onepassword-operator-values
      valuesKey: values.yaml
