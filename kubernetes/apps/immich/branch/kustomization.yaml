---
# Production's immich (../base) in a branch namespace on the development cluster. The
# chart, values.yaml and database are production's, so a PR that changes them is what the
# smoke test runs. Differences: production's SOPS Secrets are left out and the app reads the
# -onepassword Secrets from development's vault instead (spec.values below), the route is
# internal only, and the claims are sized for development.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich-${branch_slug}
resources:
  - ../base
  - onepassword-items/configuration.yaml
  - onepassword-items/postgres-user.yaml
patches:
  # Development cannot decrypt production's SOPS Secrets; the OnePasswordItems in
  # onepassword-items/ create Secrets with the same names from development's vault.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: immich-secrets
        namespace: immich
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: immich-postgres-user
        namespace: immich
  - target:
      kind: Namespace
      name: immich
    patch: |-
      - op: replace
        path: /metadata/name
        value: immich-${branch_slug}
  - target:
      kind: HTTPRoute
      name: immich
    patch: |-
      - op: replace
        path: /spec/parentRefs
        value:
          - name: internal
            namespace: gateway
            sectionName: https-gateway
      - op: replace
        path: /spec/hostnames/0
        value: immich-${branch_slug}.${cluster_domain}
  - target:
      kind: PersistentVolumeClaim
      name: immich-library
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: immich
    patch: |-
      - op: replace
        path: /spec/chartRef/namespace
        value: immich-${branch_slug}
      # Production's values.yaml, with only the Secret names pointed at the ones
      # development's 1Password vault provides (Flux merges spec.values last).
      - op: add
        path: /spec/values
        value:
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: immich-postgres-user-onepassword
          immich:
            existingConfiguration: immich-secrets-onepassword
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: immich-postgres
    patch: |-
      - op: replace
        path: /spec/storage/size
        value: 10Gi
      - op: replace
        path: /spec/bootstrap/initdb/secret/name
        value: immich-postgres-user-onepassword
