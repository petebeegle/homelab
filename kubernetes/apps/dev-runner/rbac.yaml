---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-runner
  namespace: dev-runner
automountServiceAccountToken: true
---
# Branch environments are Flux objects in flux-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-runner-flux
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-runner-flux
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-runner-flux
subjects:
  - kind: ServiceAccount
    name: dev-runner
    namespace: dev-runner
---
# Read what the branch environments create, plus the verifier's probe pods.
# No access to secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-runner
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dev-runner
subjects:
  - kind: ServiceAccount
    name: dev-runner
    namespace: dev-runner
