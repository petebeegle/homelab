---
# GitHub App credentials ARC uses to register runners (fields github_app_id,
# github_app_installation_id, github_app_private_key become the Secret's keys).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ci-runner-github-app
  namespace: ci-runner
  labels:
    app.kubernetes.io/managed-by: onepassword-operator
type: Opaque
spec:
  itemPath: "vaults/ydtsmbjna24k5of6ga23boczuu/items/github_arc"
---
# Kubeconfig for the development cluster's dev-runner ServiceAccount (Document item, file
# name "kubeconfig"). Its token is kubernetes/apps/dev-runner/token.yaml in development; it can
# manage Flux branch environments there and nothing in production.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: dev-runner-kubeconfig
  namespace: ci-runner
  labels:
    app.kubernetes.io/managed-by: onepassword-operator
type: Opaque
spec:
  itemPath: "vaults/ydtsmbjna24k5of6ga23boczuu/items/dev-runner-kubeconfig"
